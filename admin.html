<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Panel Administracyjny - FitReserve</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
<base target="_blank">
</head>
<body class="admin-body">
  <header class="admin-header">
    <div class="container admin-header-inner">
      <div style="display: flex; align-items: center; gap: 10px; min-width: 0;">
        <a href="index.html" class="logo" style="font-size: 1.1rem;">
          <div class="logo-icon" style="width: 30px; height: 30px;">💪</div>
          FitReserve
        </a>
      </div>
      <div style="display: flex; align-items: center; gap: 10px; flex-shrink: 0;">
        <a href="index.html" class="btn btn-secondary btn-sm" style="padding: 8px 12px; font-size: 0.8rem;">← Strona</a>
      </div>
    </div>
  </header>

  <main class="admin-main">
    <div class="container">
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-value" id="statTotalTrainings">0</div>
          <div class="stat-label">Treningów</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statTotalBookings">0</div>
          <div class="stat-label">Zapisanych</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statAvailableSpots">0</div>
          <div class="stat-label">Wolne miejsca</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="statFullTrainings">0</div>
          <div class="stat-label">Zapełnione</div>
        </div>
      </div>

      <div class="admin-layout">
        <!-- Form Panel -->
        <aside class="admin-panel collapsed">
        
          <div class="admin-panel-header" id="addTrainingToggle">
            <h3>➕ Dodaj trening</h3>
            <span class="toggle-icon">▼</span>
          </div>
        
          <div class="admin-panel-content" id="addTrainingContent">
        
            <form id="addTrainingForm">
            <div class="form-group">
              <label class="form-label" for="trainingTitle">Nazwa treningu</label>
              <select class="form-select" id="trainingTitle" required>
                <option value="">Wybierz...</option>
                <option value="Trening grupowy">Trening hybrydowy</option>
                <option value="Trening indywidualny">Trening indywidualny</option>
                <option value="custom">✏️ Inna nazwa...</option>
              </select>
              <div id="customTitleWrap" style="display: none; margin-top: 10px;">
                <input type="text" class="form-input" id="customTitle" placeholder="Wpisz nazwę treningu">
              </div>
            </div>

            <div class="form-row">
              <div class="form-group">
                <label class="form-label" for="trainingDate">Data startu *</label>
                <input type="date" class="form-input" id="trainingDate" required>
                <p class="form-hint" id="dayOfWeekHint" style="margin-top: 4px; color: var(--accent); font-weight: 600;"></p>
              </div>
              <div class="form-group">
                <label class="form-label" for="trainingTime">Godzina *</label>
                <input type="time" class="form-input" id="trainingTime" required value="17:00">
              </div>
            </div>

            <div class="form-group">
              <label class="form-label" for="trainingCapacity">Liczba miejsc *</label>
              <input type="number" class="form-input" id="trainingCapacity" min="1" max="100" value="6" required>
            </div>

            <div class="form-group">
              <label class="form-label">Typ treningu</label>
              <div class="radio-group">
                <label class="radio-option active">
                  <input type="radio" name="trainingType" value="single" checked>
                  📅 Jednorazowy
                </label>
                <label class="radio-option">
                  <input type="radio" name="trainingType" value="cyclic">
                  🔄 Cykliczny
                </label>
              </div>
            </div>

            <div id="cyclicFields" style="display: none;">
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label" for="intervalWeeks">Co ile tyg.?</label>
                  <input type="number" class="form-input" id="intervalWeeks" min="1" max="12" value="1">
                </div>
                <div class="form-group">
                  <label class="form-label" for="weeksCount">Przez ile tyg.?</label>
                  <input type="number" class="form-input" id="weeksCount" min="1" max="52" value="4">
                </div>
              </div>
              <p class="form-hint" id="cyclicPreview" style="color: var(--accent); font-weight: 500;"></p>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 8px;">
              Dodaj do grafiku
            </button>
          </form>
      
        </div>
        </aside>

        <!-- Tables -->
        <div>
          <!-- Trainings Table -->
          <div class="admin-table-container collapsed">
          
            <div class="admin-table-header accordion-header" id="trainingsToggle">
          
              <h3>📋 Nadchodzące treningi</h3>
          
              <span class="toggle-icon">▼</span>
          
            </div>
          
          
            <div class="accordion-content" id="trainingsContent">
          
              <div style="overflow-x: auto; -webkit-overflow-scrolling: touch;">
          
                <table class="admin-table">
                <thead>
                  <tr>
                    <th>Data</th>
                    <th>Godz.</th>
                    <th>Nazwa</th>
                  </tr>
                </thead>
                <tbody id="adminTableBody"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Training Details Modal -->
<div class="confirm-overlay training-modal-overlay" id="trainingModal">

  <div class="confirm-box training-modal-box">



    

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px;">

      <h3 id="modalTitle">Trening</h3>

      <button
        id="closeTrainingModal"
        class="btn btn-secondary btn-sm">
        ✕
      </button>

    </div>

    <div id="modalInfo"></div>

    <hr style="margin:20px 0;">

    <h4 style="margin-bottom:14px;">
      Zapisane osoby
    </h4>
    
    <div id="modalBookings"></div>
    
    <div style="margin-top:20px;text-align:right;">

      <button
        id="deleteTrainingBtn"
        class="btn btn-danger">
        Usuń trening
      </button>

    </div>

  </div>
</div>
  
  <!-- Confirm Modal -->
  <div class="confirm-overlay" id="confirmOverlay">
    <div class="confirm-box">
      <h4 id="confirmTitle">Usuwanie</h4>
      <p id="confirmMessage">Czy na pewno?</p>
      <div class="confirm-actions">
        <button class="btn btn-secondary" id="cancelDelete">Anuluj</button>
        <button class="btn btn-danger" id="confirmDelete">Usuń</button>
      </div>
    </div>
  </div>

  <script type="module" src="admin.js"></script>
</body>
</html>
