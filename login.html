<!DOCTYPE html>
<html lang="pl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>FitReserve • Panel administratora</title>

<link rel="stylesheet" href="style.css">

<style>

.login-page{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:24px;
}

.login-card{
    width:100%;
    max-width:420px;
    background:var(--bg-secondary);
    border:1px solid var(--border);
    border-radius:var(--radius);
    padding:32px;
    box-shadow:var(--shadow);
}

.login-logo{
    width:72px;
    height:72px;
    margin:0 auto 24px;
    background:var(--accent);
    border-radius:20px;
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:32px;
}

.login-card h1{
    text-align:center;
    margin-bottom:8px;
}

.login-card p{
    text-align:center;
    color:var(--text-secondary);
    margin-bottom:32px;
}

.login-error{
    display:none;
    margin-bottom:20px;
    padding:12px 16px;
    border-radius:var(--radius-sm);
    background:rgba(239,68,68,.12);
    color:var(--danger);
    border:1px solid rgba(239,68,68,.25);
    font-size:.9rem;
}

.login-card .btn{
    width:100%;
    margin-top:8px;
}

.login-footer{
    text-align:center;
    margin-top:24px;
    color:var(--text-muted);
    font-size:.85rem;
}

</style>

</head>

<body>

<div class="login-page">

    <div class="login-card">

        <div class="login-logo">
            🏋️
        </div>

        <h1>Panel administratora</h1>

        <p>Zaloguj się do FitReserve</p>

        <div id="error" class="login-error"></div>

        <div class="form-group">
            <label class="form-label">Email</label>
            <input
                id="email"
                type="email"
                class="form-input"
                placeholder="admin@fitreserve.pl">
        </div>

        <div class="form-group">
            <label class="form-label">Hasło</label>
            <input
                id="password"
                type="password"
                class="form-input"
                placeholder="••••••••">
        </div>

        <button id="login" class="btn btn-primary">
            Zaloguj się
        </button>

        <div class="login-footer">
            FitReserve Admin
        </div>

    </div>

</div>

<script type="module">

import { createClient }
from "https://esm.sh/@supabase/supabase-js@2";

const supabase = createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);

const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const loginButton = document.getElementById("login");
const errorBox = document.getElementById("error");

async function login(){

    errorBox.style.display="none";

    loginButton.disabled=true;
    loginButton.textContent="Logowanie...";

    const {error}=await supabase.auth.signInWithPassword({

        email:emailInput.value.trim(),
        password:passwordInput.value

    });

    if(error){

        errorBox.textContent="Nieprawidłowy email lub hasło.";
        errorBox.style.display="block";

        loginButton.disabled=false;
        loginButton.textContent="Zaloguj się";

        return;
    }

    window.location.href="admin.html";

}

loginButton.onclick=login;

passwordInput.addEventListener("keydown",(e)=>{

    if(e.key==="Enter"){

        login();

    }

});

</script>

</body>
</html>
